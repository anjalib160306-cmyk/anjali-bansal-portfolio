<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Message Sent | Anjali Bansal</title>

    <style>
        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#f7f4ec;
            font-family:"Trebuchet MS", Arial, sans-serif;
            color:#403a35;
            padding:20px;
        }

        .success-box{
            max-width:550px;
            width:100%;
            text-align:center;
            background:#fffdf8;
            border:1px solid #d8d0c3;
            border-radius:25px;
            padding:50px 35px;
            box-shadow:0 15px 40px rgba(70,60,50,.09);
        }

        .icon{
            font-size:55px;
            margin-bottom:20px;
        }

        h1{
            font-family:Georgia, serif;
            font-size:38px;
            margin-bottom:15px;
        }

        p{
            color:#6f6860;
            font-size:16px;
            margin-bottom:28px;
            line-height:1.7;
        }

        a{
            display:inline-block;
            padding:12px 25px;
            border-radius:30px;
            background:#647d6d;
            color:white;
            text-decoration:none;
            font-weight:bold;
        }

        a:hover{
            background:#506758;
        }
    </style>
</head>

<body>

    <div class="success-box">

        <div class="icon">✦</div>

        <h1>Message Sent!</h1>

        <p>
            Thank you for reaching out.
            Your message has been received successfully.
        </p>

        <a href="index.html">
            Back to Portfolio
        </a>

    </div>

</body>
</html>
